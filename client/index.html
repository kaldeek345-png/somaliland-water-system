<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceel-Care | Somaliland Water System</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS-ka muuqaalka Website-ka */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; text-align: center; background-color: #f4f4f4; }
        header { background-color: #006c35; color: white; padding: 25px; border-bottom: 6px solid #cc0000; }
        .hero { padding: 30px; }
        .btn { background-color: #006c35; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 5px; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .btn:hover { background-color: #004d26; }
        
        /* Meesha Khariidadu fadhiisanayso */
        #map { 
            height: 500px; 
            width: 95%; 
            margin: 20px auto; 
            border: 3px solid #006c35; 
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>💧 Ceel-Care</h1>
        <p>Nidaamka Maamulka Biyaha ee Somaliland</p>
    </header>

    <main class="hero">
        <h2>Horumarka Biyaha Dalka</h2>
        <p>Ku soo dhawaada nidaamka lagu diiwaangeliyo ceelasha biyaha dalka.</p>
        <button class="btn" onclick="focusMap()">Eeg Khariidada</button>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 3. Kicinta Khariidadda iyo Calaamadaha (Markers)
        // Bartamaha Somaliland
        var map = L.map('map').setView([9.5624, 44.0677], 7);

        // Sawirka khariidadda dhabta ah
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Calaamadaha magaalooyinka waaweyn
        var locations = [
            { name: "Hargeisa", coords: [9.5624, 44.0677] },
            { name: "Berbera", coords: [10.4391, 45.0143] },
            { name: "Burao", coords: [9.5209, 45.5330] },
            { name: "Boorama", coords: [9.9366, 43.1814] },
            { name: "Erigavo", coords: [10.6162, 47.3679] },
            { name: "Las Anod", coords: [8.4761, 47.3597] }
        ];

        // Loop lagu saarayo dhibcaha khariidadda
        locations.forEach(function(loc) {
            L.marker(loc.coords).addTo(map)
                .bindPopup('<b>' + loc.name + '</b><br>Ceel biyoodka gobolka.');
        });

        function focusMap() {
            document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
